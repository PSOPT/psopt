name: Build‑and‑test 

permissions:
  contents: read      # already default, but keep explicit
  packages: read      # ✔ allows pulling private GHCR images


# ────────── TRIGGERS ────────────────────────────────────────────── 
on:
  push:
    branches: [master]           # run on pushes to master
    paths-ignore:
      - 'README.md'    
  pull_request:
    branches: [master]           # run on PRs targeting master
    paths-ignore:
      - 'README.md'   
  workflow_dispatch:             # manual “Run workflow” button
  schedule:                      # nightly 02:30 UTC
    - cron: '30 2 * * *'
# ──────────────────────────────────────────────────────────────────

jobs:
  build:
    runs-on: ubuntu-latest       # GitHub‑hosted runner
    # Use your pre‑built Manjaro/Arch container so pacman/yay are available
    container:
      image: ghcr.io/psopt/psopt-ci:latest    # <- change if necessary

    strategy:
      matrix:
        build_type: [Release]    # add Debug if desired

    env:
      EXAMPLES:  "twoburn,low_thrust,zpm,shuttle_reentry,launch,manutec,cracking,delay1,geodesic,climb"
      # One reference cost per example, in the same order, compared with a relative
      # tolerance of 1e-3 by .github/scripts/run_examples.py. "none" marks a run-only
      # example: it must still build and converge, but its cost is not checked.
      # notorious is a parameter-estimation problem with randomly generated noisy
      # measurements, so its least-squares residual is not a portable invariant (it
      # varies with the platform RNG) even though the estimated parameter correctly
      # recovers pi.
      #
      # The last three cover ground the first six do not, and each has a value verified
      # outside PSOPT:
      #   cracking       parameter estimation, with the initial conditions of the
      #                  published problem; COPS reference 5.23659e-03
      #   delay1         delayed states; the discretized problem is a QP, solved
      #                  exactly outside PSOPT to give 2.52572
      #   geodesic       an equality path constraint; the exact geodesic on this
      #                  spheroid is 5549.6819 km by Karney's algorithm
      #   climb          1D and 2D interpolation from look-up tables inside the
      #                  dynamics, with automatic differentiation. The interval
      #                  selection in the library's spline routines has to be
      #                  recorded on the tape rather than resolved while it is
      #                  written; when it is not, this example does not merely
      #                  lose accuracy, it fails to converge to the right problem
      #                  (tf = 499.6 s against 321 s, local error 0.95 against
      #                  2.7e-4). It is the only example in this list that
      #                  exercises that path. The atmosphere used to pose the same
      #                  question and no longer does: it comes from
      #                  include/us76.h, which has no interval to select.
      #
      # examples/delay_history is deliberately not in this list: it runs with
      # print_level 0, so it writes no solver summary for this script to parse, and
      # the same problem is covered exactly by the DelayedVariables tests that ctest
      # runs a few steps above, against the same closed-form answers.
      #
      # Re-measured on 1 September 2026, after the discretization-error estimator was
      # corrected to use the polynomial each transcription defines rather than a cubic
      # spline through the node values. That changes where automatic mesh refinement
      # stops, so five of these ten converge on a different final mesh than they did.
      # All ten still agree with the values below, the largest departure being
      # low_thrust at 6.0e-5 relative, sixteen times inside the 1e-3 tolerance:
      #
      #   low_thrust  -2.203512e-01   (114 nodes before, 101 now)
      #   zpm          6.680106e+06
      #   manutec      2.040442e+01
      #   delay1       2.525754e+00   (72 nodes before, 67 now)
      #   climb        3.211094e+02   (74 nodes before, 58 now)
      #
      # The values are deliberately left as they are. They were established
      # independently of this machine, and a reference that a later build reproduces
      # to 6e-5 is a stronger test than one re-centred on whatever the last run
      # happened to give.
      #
      # One exception, made on the same day. examples/climb now takes its atmosphere
      # from include/us76.h rather than from its own transcription of the standard,
      # and its sea-level density constant was 1.22521 kg/m^3 where the standard
      # defines 1.225. The minimum time moves from 321.1089 s to 321.0142 s, a
      # deliberate correction of 3.0e-4 relative rather than a drift, so the climb
      # reference is moved with it. The other nine are re-measured and unchanged;
      # the Hermite-Simpson cost-quadrature correction of the same day touches none
      # of them, since none has a running cost that is nonlinear in the state.
      REF_COSTS: "-2.367249e-01,-2.203380e-01,6.680110e+06,-3.414119e+01,-7.529661e+03,2.040420e+01,5.228971e-03,2.525738e+00,5.549682e+03,3.210142e+02"

    steps:
      - uses: actions/checkout@v5

      - name: Mark workspace safe for git
        # Fixes the "detected dubious ownership in repository" git error inside the
        # container (the checked-out workspace is owned by a different uid than the
        # job user). Without this, PSOPT's CMake git-describe fails and the version
        # string falls back to a bare date.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure CppAD is available
        # ci.yml builds inside the pre-baked ghcr.io/psopt/psopt-ci image. Until that
        # image is rebuilt (via publish_image.yml) to include CppAD, install it here so
        # the AD backend is present regardless of image state. Once CppAD is baked into
        # the image under /usr, this step detects it and becomes a fast no-op. CppAD is
        # built from source (not the AUR) so libcppad_lib -- which PSOPT links -- is
        # guaranteed present. Note: CppAD uses 'cppad_prefix', not CMAKE_INSTALL_PREFIX.
        run: |
          if [ -f /usr/include/cppad/cppad.hpp ] && \
             find /usr/lib /usr/lib64 -name 'libcppad_lib.*' 2>/dev/null | grep -q .; then
            echo "CppAD already present in image; skipping build."
          else
            echo "CppAD not found in image; building from source and installing to /usr."
            git clone --depth 1 https://github.com/coin-or/CppAD.git /tmp/cppad-src
            cd /tmp/cppad-src && mkdir build && cd build
            cmake -D cppad_prefix=/usr ..
            make -j"$(nproc)"
            make install
            cd / && rm -rf /tmp/cppad-src
          fi

      - name: Configure
        run: |
          cmake -B build \
          -DBUILD_EXAMPLES=ON \
          -DBUILD_TESTS=ON \
          -DHEADLESS=ON \
          -DPSOPT_STRICT_WARNINGS=ON \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON \
          -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run unit tests (GoogleTest)
        working-directory: build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
        run: ctest --output-on-failure
        
      - name: Ensure python is available
        run: |
          # python is baked into the CI image (see Dockerfile). This guard keeps
          # the workflow working on older images that predate that change: if
          # python is missing, install it at runtime. The fallback first
          # bootstraps the pacman keyring (the old image's was never initialised,
          # so the archlinux-keyring hook fails with "no secret key available to
          # sign with"), then overwrites the forward-compatible libgcc/libstdc++
          # files that conflict with the image's older monolithic gcc-libs.
          if command -v python >/dev/null 2>&1; then
            echo "python already present: $(python --version)"
          else
            echo "python not found; installing at runtime (pre-bake image)"
            pacman-key --init
            pacman-key --populate
            pacman -Sy --noconfirm archlinux-keyring
            pacman -S  --noconfirm \
              --overwrite '/usr/lib/libgcc_s.so*' \
              --overwrite '/usr/lib/libstdc++.so*' \
              python
          fi
        
      - name: Debug one executable
        run: |
         file build/examples/twoburn/twoburn
         ldd  build/examples/twoburn/twoburn || true        

      - name: Run selected examples & parse results
        env:
         LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib   # ← add this
        run: |
         python .github/scripts/run_examples.py \
         --exe-dir build/examples \
         --summary build/test_summary.json

      - name: Upload solution files & summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: psopt-logs
          path: |
            build/examples/**/psopt_solution_*.txt
            build/test_summary.json

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      # 1) Check out gh-pages and persist GITHUB_TOKEN so we can push
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      # 2) Download the test_summary.json artefact
      - name: Download summary
        uses: actions/download-artifact@v7
        with:
          name: psopt-logs
          path: tmp_summary

      # 3) Copy test_summary.json into artifacts/
      - name: Copy test_summary.json
        run: |
          mkdir -p artifacts
          SUMMARY=$(find tmp_summary -type f -name 'test_summary.json' | head -n1)
          if [ -z "$SUMMARY" ]; then
            echo "::error ::test_summary.json not found"
            exit 1
          fi
          cp "$SUMMARY" artifacts/test_summary.json

      - name: Build Markdown report
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.load(open('artifacts/test_summary.json'))
          lines = ["# PSOPT CI Examples Test Summary", "", "| Example | Passed | Cost | Time (s) |", "|---|---|---|---|"]
          for name, info in data.items():
              lines.append(f"| {name} | {'✅' if info['passed'] else '❌'} | {info['cost']} | {info['elapsed_s']:.2f} |")
          pathlib.Path('artifacts/README.md').write_text("\n".join(lines))
          print("👉 Generated artifacts/README.md")
          PY
      # 4) Generate examples_badge.json from test_summary.json
      - name: Build badge JSON
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.load(open('artifacts/test_summary.json'))
          total  = len(data)
          passed = sum(1 for v in data.values() if v.get("passed"))
          badge  = {
            "schemaVersion": 1,
            "label": "Selected examples",
            "message": f"{passed}/{total} passed",
            "color": "green" if passed == total else "red"
          }
          pathlib.Path('artifacts/examples_badge.json').write_text(json.dumps(badge))
          PY

      # 5) Copy your index.html if you have one
      - name: Copy dashboard HTML
        run: |
          if [ -f tmp_summary/index.html ]; then
            cp tmp_summary/index.html artifacts/index.html
          fi

      # 6) Commit & push any changes
      - name: Commit & push artifacts
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add artifacts/*
          git commit -m "chore: update test artifacts [skip ci]" || echo "No changes to commit."
          git push origin gh-pages || echo "Nothing to push."
